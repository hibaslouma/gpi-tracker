<div class="admin-container">

  <div class="admin-header">
    <h1>Dashboard</h1>
  </div>

  <!-- Stats Cards -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-info">
        <span class="stat-number">{{ backofficeCount }}</span>
        <span class="stat-label">Backoffice</span>
      </div>
      <div class="stat-icon">
        <i class="pi pi-briefcase"></i>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-info">
        <span class="stat-number">{{ clientCount }}</span>
        <span class="stat-label">Clients</span>
      </div>
      <div class="stat-icon">
        <i class="pi pi-users"></i>
      </div>
    </div>

    <div class="stat-card stat-card-highlight">
      <div class="stat-info">
        <span class="stat-number">{{ totalCount }}</span>
        <span class="stat-label">Total utilisateurs</span>
      </div>
      <div class="stat-icon">
        <i class="pi pi-chart-bar"></i>
      </div>
    </div>

    <div class="stat-card stat-card-success">
      <div class="stat-info">
        <span class="stat-number">{{ activeCount }}</span>
        <span class="stat-label">Comptes actifs</span>
      </div>
      <div class="stat-icon">
        <i class="pi pi-check-circle"></i>
      </div>
    </div>
  </div>

  <!-- Derniers utilisateurs -->
  <div class="content-grid">
    <div class="content-card">
      <div class="card-header">
        <h2>Derniers utilisateurs</h2>
        <button class="see-all" (click)="navigate('/admin/utilisateurs')">
          Voir tout <i class="pi pi-arrow-right"></i>
        </button>
      </div>
      <table class="data-table">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Rôle</th>
            <th>Statut</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of recentUsers">
            <td>
              <div class="user-cell">
                <div class="user-avatar-sm">{{ user.initials }}</div>
                <div>
                  <div class="user-name">{{ user.name }}</div>
                  <div class="user-email">{{ user.email }}</div>
                </div>
              </div>
            </td>
            <td>
              <span class="role-badge" [class.backoffice]="user.role === 'Backoffice'">
                {{ user.role }}
              </span>
            </td>
            <td>
              <span class="status-badge" [class.active]="user.active">
                {{ user.active ? 'Actif' : 'Inactif' }}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
